<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Фон Артёма: топографическая карта + снаряжение. Используется как маска, цвет задаёт CSS. -->
  <defs>
    <!-- HK416-подобная винтовка, вид сбоку, ~150px -->
    <g id="rifle" fill="none" stroke-linejoin="round">
      <path d="M2 9h22l6 3v8H6l-4-4z"/>
      <path d="M24 10h6"/>
      <path d="M30 7h88v9H30z"/>
      <path d="M36 3h80v4H36z"/>
      <path d="M40 5h74" stroke-dasharray="2 2"/>
      <path d="M118 10.5h34v2.6h-34z"/>
      <path d="M146 10.5V5h3v5.5"/>
      <path d="M38 3V0h6v3"/>
      <path d="M64 16h10l4 20h-10z"/>
      <path d="M66 22h9M67 28h9"/>
      <path d="M44 16h8l-4 15h-7z"/>
      <path d="M52 16q4 9 10 0"/>
      <path d="M84 9h30M84 13h30"/>
    </g>
    <!-- Glock-подобный пистолет, ~60px -->
    <g id="pistol" fill="none" stroke-linejoin="round">
      <path d="M0 0h58v10H0z"/>
      <path d="M4 2v6M7 2v6M10 2v6"/>
      <path d="M4 10h50v4H20"/>
      <path d="M8 14h12l-3 22H5z"/>
      <path d="M7 20h11M6 26h11M6 32h10"/>
      <path d="M20 14q1 8 12 7v-7"/>
      <path d="M25 14v4"/>
      <path d="M54 0v-2h2v2"/>
    </g>
    <!-- магазин 5.56 -->
    <g id="mag" fill="none" stroke-linejoin="round">
      <path d="M0 0h14v5l4 30H4L0 5z"/>
      <path d="M2 10h13M3 16h13M3 22h14M4 28h14"/>
      <path d="M3 35h16v3H3z"/>
      <path d="M3 0q4-4 8 0"/>
    </g>
    <!-- патрон -->
    <g id="round" fill="none" stroke-linejoin="round">
      <path d="M0 8q4-12 8 0z"/>
      <path d="M0 8h8v4l1 2v14H-1V14l1-2z"/>
      <path d="M-1 26h10"/>
    </g>
    <!-- плитник -->
    <g id="plate" fill="none" stroke-linejoin="round">
      <path d="M0 16 8 8V0h8l4 10h20l4-10h8v8l8 8v44H0z"/>
      <path d="M6 28h48M6 35h48M6 42h48M6 49h48"/>
      <path d="M12 18h10v14H12zM25 18h10v14H25zM38 18h10v14H38z"/>
      <path d="M22 54h16"/>
    </g>
    <!-- шлем high-cut (типа Ops-Core) -->
    <g id="helmet" fill="none" stroke-linejoin="round">
      <path d="M2 32C2 10 16 0 34 0s30 12 30 30l-6 2c-4-6-8-8-12-8l-2 8z"/>
      <path d="M16 27l28-3"/>
      <path d="M4 14h9v9H4z"/>
      <path d="M8 23v4"/>
      <path d="M26 4h14v7H26z"/>
      <path d="M52 10l6 6"/>
    </g>
    <!-- значки карты -->
    <g id="peak" fill="none" stroke="#000" stroke-width="1.2"><path d="M0 8 5 0l5 8z"/><circle cx="5" cy="5.4" r=".8" fill="#000"/></g>
    <g id="bench" fill="none" stroke="#000" stroke-width="1.2"><circle r="4"/><circle r="1" fill="#000"/></g>
    <g id="cross" stroke="#000" stroke-width="1"><path d="M-5 0h10M0-5v10"/></g>
    <g id="tree" fill="none" stroke="#000" stroke-width="1.1"><circle r="3.2"/><path d="M0 3.2v3"/></g>
    <g id="flag" fill="none" stroke="#000" stroke-width="1.2"><path d="M0 14V0h10l-3 3 3 3H0"/></g>
  </defs>

  <mask id="knock" maskUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="680">
    <rect x="-20" y="-20" width="680" height="680" fill="#fff"/>
    <g stroke="#000" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="#000">
  <use href="#rifle" transform="translate(372 286) rotate(-14)"/>
  <use href="#rifle" transform="translate(150 596) rotate(-3) scale(.75)"/>
  <use href="#pistol" transform="translate(62 330) rotate(10)"/>
  <use href="#mag" transform="translate(250 220) rotate(-18)"/>
  <use href="#mag" transform="translate(570 520) rotate(22)"/>
  <use href="#round" transform="translate(206 384) rotate(30)"/>
  <use href="#round" transform="translate(222 392) rotate(48)"/>
  <use href="#round" transform="translate(30 30) rotate(-20)"/>
  <use href="#round" transform="translate(490 160) rotate(64)"/>
  <use href="#plate" transform="translate(190 500) rotate(-6)"/>
  <use href="#helmet" transform="translate(470 40) rotate(4)"/>
  <use href="#helmet" transform="translate(40 600) rotate(-10) scale(.8)"/>
  <use href="#pistol" transform="translate(520 600) rotate(-24) scale(.85)"/>
    </g>
  </mask>
  <g mask="url(#knock)">
  <!-- горизонтали: холм А -->
  <g fill="none" stroke="#000" stroke-width="1">
    <path d="M150 150c18-22 64-20 76 4s-6 46-38 46-52-28-38-50z"/>
    <path d="M118 140c26-46 118-44 138 6s-26 86-86 84-80-48-52-90z"/>
    <path d="M86 128c34-72 176-70 200 8s-42 124-122 122-114-66-78-130z"/>
    <path d="M52 118c40-98 236-96 266 8s-56 162-160 160-150-84-106-168z" stroke-dasharray="1 0"/>
    <path d="M20 104c44-124 300-124 334 8s-72 202-202 198S-30 210 20 104z" stroke-width="1.6"/>
    <!-- холм Б -->
    <path d="M462 452c14-16 46-14 54 4s-6 32-28 32-38-20-26-36z"/>
    <path d="M436 440c22-38 96-36 112 6s-22 70-70 68-66-40-42-74z"/>
    <path d="M408 426c28-60 150-58 170 8s-34 106-104 104-96-56-66-112z"/>
    <path d="M378 412c34-82 204-80 230 8s-46 142-140 140-134-74-90-148z" stroke-width="1.6"/>
    <!-- склоны / долина -->
    <path d="M-10 420c60-10 110 30 170 24s100-54 160-40 40 70 20 110-40 90-10 136"/>
    <path d="M-10 460c56-6 104 34 160 30s104-50 152-34 26 64 6 104-30 70-4 90"/>
    <path d="M-10 500c50 0 98 36 150 34s96-40 138-28 16 54 0 92-16 52 0 52"/>
    <path d="M430 -10c-10 40 20 70 70 76s100 12 150-8"/>
    <path d="M400 -10c-14 54 22 96 92 104s110 10 158-12"/>
    <path d="M370 -10c-16 70 24 122 112 132s126 6 168-18" stroke-width="1.6"/>
    <!-- ручей -->
    <path d="M330 640c-6-40 20-70 10-110s-40-60-30-100 40-50 46-90" stroke-dasharray="6 4"/>
  </g>

  </g>
  <!-- отметки высот -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#000">
    <text x="176" y="180">412.6</text>
    <text x="236" y="102" transform="rotate(32 236 102)">380</text>
    <text x="300" y="168" transform="rotate(78 300 168)">340</text>
    <text x="40" y="234" transform="rotate(-58 40 234)">300</text>
    <text x="476" y="478">356.1</text>
    <text x="566" y="420" transform="rotate(70 566 420)">320</text>
    <text x="392" y="520" transform="rotate(-48 392 520)">280</text>
    <text x="70" y="452" transform="rotate(8 70 452)">240</text>
    <text x="560" y="96" transform="rotate(-8 560 96)">260</text>
    <text x="350" y="600" font-size="9" font-style="italic">руч. Сухой</text>
    <text x="560" y="610" font-size="9">кв. 47</text>
  </g>

  <!-- значки карты -->
  <use href="#peak" x="160" y="166"/>
  <use href="#peak" x="461" y="464"/>
  <use href="#bench" x="250" y="300"/>
  <use href="#bench" x="600" y="250"/>
  <use href="#cross" x="320" y="320"/>
  <use href="#cross" x="0" y="320"/>
  <use href="#cross" x="320" y="0"/>
  <use href="#cross" x="0" y="0"/>
  <use href="#cross" x="640" y="0"/>
  <use href="#cross" x="0" y="640"/>
  <use href="#cross" x="640" y="640"/>
  <use href="#cross" x="640" y="320"/>
  <use href="#cross" x="320" y="640"/>
  <use href="#tree" x="120" y="560"/><use href="#tree" x="134" y="572"/><use href="#tree" x="112" y="580"/><use href="#tree" x="146" y="556"/>
  <use href="#tree" x="600" y="340"/><use href="#tree" x="614" y="352"/><use href="#tree" x="592" y="360"/>
  <use href="#flag" x="520" y="200"/>

  <!-- снаряжение -->
  <g stroke="#000" stroke-width="1.3" stroke-linejoin="round">
  <use href="#rifle" transform="translate(372 286) rotate(-14)"/>
  <use href="#rifle" transform="translate(150 596) rotate(-3) scale(.75)"/>
  <use href="#pistol" transform="translate(62 330) rotate(10)"/>
  <use href="#mag" transform="translate(250 220) rotate(-18)"/>
  <use href="#mag" transform="translate(570 520) rotate(22)"/>
  <use href="#round" transform="translate(206 384) rotate(30)"/>
  <use href="#round" transform="translate(222 392) rotate(48)"/>
  <use href="#round" transform="translate(30 30) rotate(-20)"/>
  <use href="#round" transform="translate(490 160) rotate(64)"/>
  <use href="#plate" transform="translate(190 500) rotate(-6)"/>
  <use href="#helmet" transform="translate(470 40) rotate(4)"/>
  <use href="#helmet" transform="translate(40 600) rotate(-10) scale(.8)"/>
  <use href="#pistol" transform="translate(520 600) rotate(-24) scale(.85)"/>
  </g>
</svg>
