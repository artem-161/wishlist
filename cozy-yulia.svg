<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Фон Юли: уютная «фермерская» тема — лесные духи-кругляши, грядки, урожай, звёздочки.
       Используется как маска, цвет задаёт CSS. Глаза и блики — вырезы (evenodd). -->
  <defs>
    <!-- лесной дух: кругленький, с листочком-ростком на макушке -->
    <g id="spirit">
      <path fill-rule="evenodd" d="M0 -14c9 0 15 7 15 15 0 7-3 12-6 13 0 2-2 3-4 2-1 1-3 1-5 1s-4 0-5-1c-2 1-4 0-4-2-3-1-6-6-6-13 0-8 6-15 15-15z
        M-5 -1a2.2 2.6 0 1 0 0 .1z M5 -1a2.2 2.6 0 1 0 0 .1z"/>
      <path d="M0 -14c0-5 1-8 4-11-1 4-1 7-4 11z"/>
      <path d="M0.5 -20c4-4 9-5 12-3-3 3-7 4-12 3z"/>
    </g>
    <!-- пастернак / морковка -->
    <g id="root">
      <path d="M-5 0c0-4 2-6 5-6s5 2 5 6c0 9-3 18-5 24-2-6-5-15-5-24z"/>
      <path d="M0 -6c-1-5-4-8-7-9 3 0 6 2 7 5 0-4 2-7 5-8-2 3-3 7-3 11z"/>
    </g>
    <!-- грибок -->
    <g id="shroom" fill-rule="evenodd">
      <path d="M-12 0c0-8 6-13 12-13s12 5 12 13z M-5 -6a2 2 0 1 0 0 .1z M5 -8a1.6 1.6 0 1 0 0 .1z"/>
      <path d="M-4 0h8l1 9h-10z"/>
    </g>
    <!-- клубничка -->
    <g id="berry" fill-rule="evenodd">
      <path d="M0 16c-8-5-11-11-11-16 0-5 5-6 11-3 6-3 11-2 11 3 0 5-3 11-11 16z M-4 4a1 1.4 0 1 0 0 .1z M3 2a1 1.4 0 1 0 0 .1z M0 9a1 1.4 0 1 0 0 .1z"/>
      <path d="M0 -3l-6-4 4 0-2-4 4 3 0-5 2 5 4-3-2 4h4z"/>
    </g>
    <!-- цыплёнок -->
    <g id="chick" fill-rule="evenodd">
      <path d="M-10 4c0-8 5-12 11-12 4 0 7 3 7 7l5 1-5 2c0 7-5 11-11 11s-7-4-7-9z M2 -3a1.5 1.5 0 1 0 0 .1z"/>
      <path d="M-4 13v4M1 13v4" stroke="#000" stroke-width="1.5" fill="none"/>
    </g>
    <!-- звезда-плод -->
    <g id="star"><path d="M0 -9l2.6 5.6 6 .7-4.5 4.1 1.2 6L0 4.4l-5.3 3 1.2-6-4.5-4.1 6-.7z"/></g>
    <!-- искорка -->
    <g id="spark"><path d="M0 -6c.8 3.6 1.6 4.4 6 6-4.4 1.6-5.2 2.4-6 6-.8-3.6-1.6-4.4-6-6 4.4-1.6 5.2-2.4 6-6z"/></g>
    <!-- сердечко -->
    <g id="heart"><path d="M0 7c-6-4-9-7-9-11 0-3 2-5 4.5-5 2 0 3.5 1 4.5 3 1-2 2.5-3 4.5-3 2.5 0 4.5 2 4.5 5 0 4-3 7-9 11z"/></g>
    <!-- листик -->
    <g id="leaf"><path d="M0 0c2-8 9-12 16-12-1 8-7 13-16 12z"/><path d="M0 0l9-7" stroke="#fff" stroke-width="0"/></g>
  </defs>

  <g fill="#000">
    <use href="#spirit" transform="translate(52 62)"/>
    <use href="#spirit" transform="translate(236 210) scale(.9) rotate(-6)"/>
    <use href="#spirit" transform="translate(150 318) scale(.75) rotate(8)"/>
    <use href="#spirit" transform="translate(318 46) scale(.7)"/>

    <use href="#root" transform="translate(150 70) rotate(18)"/>
    <use href="#root" transform="translate(30 220) rotate(-14) scale(.85)"/>
    <use href="#shroom" transform="translate(286 128)"/>
    <use href="#shroom" transform="translate(96 168) scale(.8)"/>
    <use href="#berry" transform="translate(214 46)"/>
    <use href="#berry" transform="translate(320 288) scale(.85) rotate(10)"/>
    <use href="#chick" transform="translate(64 300)"/>
    <use href="#star" transform="translate(180 150)"/>
    <use href="#star" transform="translate(340 196) scale(.7)"/>
    <use href="#heart" transform="translate(120 236) scale(.8)"/>
    <use href="#heart" transform="translate(262 330) scale(.6)"/>
    <use href="#leaf" transform="translate(196 262) rotate(-20)"/>
    <use href="#leaf" transform="translate(12 128) rotate(30) scale(.8)"/>

    <use href="#spark" transform="translate(110 20)"/>
    <use href="#spark" transform="translate(272 90) scale(.7)"/>
    <use href="#spark" transform="translate(20 350) scale(.6)"/>
    <use href="#spark" transform="translate(206 112) scale(.5)"/>
    <use href="#spark" transform="translate(300 250) scale(.6)"/>
    <circle cx="160" cy="200" r="1.8"/>
    <circle cx="250" cy="20" r="1.6"/>
    <circle cx="40" cy="120" r="1.4"/>
    <circle cx="330" cy="150" r="1.6"/>
    <circle cx="100" cy="350" r="1.4"/>
  </g>
</svg>
